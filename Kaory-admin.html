<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kaory World — Admin</title><style>body{font-family:system-ui;background:#100b18;color:#f7f1ff;margin:0;padding:32px}main{max-width:850px;margin:auto}section{background:#1b1328;border:1px solid #4b385e;border-radius:18px;padding:22px;margin:16px 0}input,button{font:inherit;padding:12px;border-radius:9px}input{background:#100b18;color:white;border:1px solid #76558b}button{background:#9b69dc;color:white;border:0;cursor:pointer}button.danger{background:#943d55}.item{display:flex;gap:15px;align-items:center;border-top:1px solid #4b385e;padding:14px 0}.item img{width:80px;height:80px;object-fit:cover;border-radius:10px}.item div{flex:1;overflow-wrap:anywhere}a{color:#d5b7ff}#msg{min-height:24px}</style></head><body><main><h1>🥝 Kaory World — Admin</h1><p>Aprove ou rejeite as fanarts enviadas antes da publicação. <a href="/">Voltar ao site</a></p><p id="msg" role="status"></p><section id="login"><h2>Entrar</h2><form id="loginForm"><input id="password" type="password" autocomplete="current-password" placeholder="Senha de administrador" required><input id="totp" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="Código do Google Authenticator" required><button>Entrar</button></form></section><section id="panel" hidden><h2>Moderação de fanarts</h2><button id="refresh">Atualizar</button> <button id="logout">Sair</button><div id="arts"></div></section></main><script src="/Kaory-admin.js" defer></script></body></html>
